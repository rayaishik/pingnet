version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: pingnet-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - pingnet-network

  redis:
    image: redis:7-alpine
    container_name: pingnet-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - pingnet-network

  server:
    build: ./server
    container_name: pingnet-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/pingnet
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=pingnet_production_secret_change_me_in_production
      - JWT_EXPIRE=7d
      - NODE_ENV=production
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
      - redis
    networks:
      - pingnet-network

  client:
    build: ./client
    container_name: pingnet-client
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - server
    networks:
      - pingnet-network

volumes:
  mongodb_data:
  redis_data:

networks:
  pingnet-network:
    driver: bridge
